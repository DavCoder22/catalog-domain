openapi: 3.0.3
info:
  title: 3D Print Catalog API
  description: API for managing 3D printed products, including catalog, recommendations, and searches in a microservices architecture.
  version: 1.0.0
  contact:
    name: Your Name
    email: your.email@example.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

paths:
  /catalog/items/{item_id}:
    get:
      summary: Get a 3D printed product by ID
      description: Retrieves a specific 3D printed product using its unique identifier.
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
          description: The ID of the 3D printed product
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product3D'
        '404':
          description: Product not found
        '500':
          description: Internal server error
    patch:
      summary: Partially update a 3D printed product
      description: Updates specific fields of a 3D printed product.
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
          description: The ID of the 3D printed product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Successful update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product3D'
        '404':
          description: Product not found
        '500':
          description: Internal server error
    delete:
      summary: Delete a 3D printed product
      description: Deletes a 3D printed product by its ID.
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
          description: The ID of the 3D printed product
      responses:
        '200':
          description: Successful deletion
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                example:
                  message: "3D Product deleted successfully"
        '404':
          description: Product not found
        '500':
          description: Internal server error

  /catalog/items:
    get:
      summary: List 3D printed products
      description: Lists all 3D printed products, optionally filtered by category.
      parameters:
        - in: query
          name: category
          required: false
          schema:
            type: string
          description: Filter products by category (e.g., Toys, Tools, Prototypes)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product3D'
        '500':
          description: Internal server error
    post:
      summary: Create a new 3D printed product
      description: Creates a new 3D printed product in the catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product3D'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product3D'
        '400':
          description: Invalid input
        '500':
          description: Internal server error

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product3D:
      type: object
      properties:
        item_id:
          type: string
          description: Unique identifier for the 3D printed product
        name:
          type: string
          description: Name of the 3D printed product
        category:
          type: string
          description: Category of the product, e.g., Toys, Tools, Prototypes
        material:
          type: string
          description: Material used for 3D printing, e.g., PLA, ABS, PETG
        detail:
          type: string
          description: Detailed description of the 3D printed object
        price:
          type: number
          description: Price of the product in USD
      required:
        - item_id
        - name
        - category
        - material
        - detail
        - price
      example:
        item_id: "3d-print-001"
        name: "Mini Robot Toy"
        category: "Toys"
        material: "PLA"
        detail: "A small, articulated robot toy for kids, 10cm height, durable and colorful."
        price: 19.99
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          description: Name of the 3D printed product
        category:
          type: string
          description: Category of the product, e.g., Toys, Tools, Prototypes
        material:
          type: string
          description: Material used for 3D printing, e.g., PLA, ABS, PETG
        detail:
          type: string
          description: Detailed description of the 3D printed object
        price:
          type: number
          description: Price of the product in USD
      example:
        price: 24.99
        detail: "Updated with LED lights"

security:
  - bearerAuth: []

tags:
  - name: catalog
    description: Operations related to 3D printed product management